<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="icon" href="images/339888103_617339846927129_7791889255149775750_n.jpg" />
    <title>3KG Barbershop — ADMIN DASHBOARD</title>
    
    <style>
        .delete-btn {
            background-color: #d9534f; /* Red danger color */
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: background-color 0.3s ease;
        }
        .delete-btn:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>
    <header>
        <img class="logo" src="images/339888103_617339846927129_7791889255149775750_n.jpg" alt="logo">
        <nav class="desktop-nav">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="admin.html" class="active">ADMIN DASHBOARD</a></li>
            </ul>
        </nav>
    </header>

    <section class="admin-section">
        <div class="admin-header">
            <h1 class="admin-title">BOOKING <span>DASHBOARD</span></h1>
            <p class="admin-sub">Manage your walk-ins and home visits</p>
        </div>

        <div class="table-container">
            <table id="bookingsTable">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Type</th>
                        <th>Location / Branch</th>
                        <th>Details</th>
                        <th>Action</th> </tr>
                </thead>
                <tbody id="bookingsBody">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">Loading bookings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <script>
        // Fetch bookings from your existing server endpoint
        async function fetchBookings() {
            try {
                const response = await fetch('https://threekg-babershop.onrender.com/api/bookings');
                const bookings = await response.json();
                
                const tbody = document.getElementById('bookingsBody');
                tbody.innerHTML = ''; // Clear the loading text

                if (bookings.length === 0) {
                    // Updated colspan to 7
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No bookings found.</td></tr>';
                    return;
                }

                // Loop through the data and build the table rows
                bookings.forEach(booking => {
                    const tr = document.createElement('tr');
                    
                    // Determine location display based on visit type
                    const location = booking.visitType === 'Home Visit' 
                        ? booking.address 
                        : booking.branch;

                    // Grab the database ID (MongoDB uses _id, some others use id)
                    const bookingId = booking._id || booking.id;

                    tr.innerHTML = `
                        <td>
                            <div class="date-time-cell">
                                <span class="b-date">${booking.date || 'N/A'}</span>
                                <span class="b-time">${booking.time || 'N/A'}</span>
                            </div>
                        </td>
                        <td>${booking.name || 'N/A'}</td>
                        <td>${booking.phone || 'N/A'}</td>
                        <td>
                            <span class="type-badge ${booking.visitType === 'Home Visit' ? 'home' : 'walk'}">
                                ${booking.visitType || 'N/A'}
                            </span>
                        </td>
                        <td>${location || 'N/A'}</td>
                        <td>${booking.details || '-'}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteBooking('${bookingId}')">DELETE</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching bookings:', error);
                // Updated colspan to 7
                document.getElementById('bookingsBody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--red);">Failed to load bookings. Make sure the server is running.</td></tr>';
            }
        }

        // New function to handle deletion
        async function deleteBooking(id) {
            // Confirm before deleting to prevent accidental clicks
            if (!confirm('Are you sure you want to delete this booking? This action cannot be undone.')) {
                return; 
            }

            try {
                // Send DELETE request to your backend
                const response = await fetch(`https://threekg-babershop.onrender.com/api/bookings/${id}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    alert('Booking deleted successfully.');
                    // Refresh the table to show updated data
                    fetchBookings();
                } else {
                    alert('Failed to delete the booking. Please try again.');
                }
            } catch (error) {
                console.error('Error deleting booking:', error);
                alert('An error occurred while trying to delete the booking.');
            }
        }

        // Run the fetch function as soon as the page loads
        document.addEventListener('DOMContentLoaded', fetchBookings);
    </script>
</body>
</html>
