<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="icon" href="images/339888103_617339846927129_7791889255149775750_n.jpg" />
    <title>3KG Barbershop — ADMIN DASHBOARD</title>
</head>
<body>
    <header>
        <img class="logo" src="images/339888103_617339846927129_7791889255149775750_n.jpg" alt="logo">
        <nav class="desktop-nav">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="admin.html" class="active">ADMIN DASHBOARD</a></li>
            </ul>
        </nav>
    </header>

    <section class="admin-section">
        <div class="admin-header">
            <h1 class="admin-title">BOOKING <span>DASHBOARD</span></h1>
            <p class="admin-sub">Manage your walk-ins and home visits</p>
        </div>

        <div class="table-container">
            <table id="bookingsTable">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Type</th>
                        <th>Location / Branch</th>
                        <th>Details</th>
                        <th>Action</th> 
                    </tr>
                </thead>
                <tbody id="bookingsBody">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">Loading bookings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h2 class="modal-title">EDIT BOOKING</h2>
            <input type="hidden" id="editId">
            
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="editPhone">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Date</label>
                    <input type="date" id="editDate">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Time</label>
                    <input type="time" id="editTime">
                </div>
            </div>
            <div class="form-group">
                <label>Visit Type</label>
                <select id="editType">
                    <option value="Walk-in">Walk-in</option>
                    <option value="Home Visit">Home Visit</option>
                </select>
            </div>
            <div class="form-group">
                <label>Location / Branch</label>
                <input type="text" id="editLocation">
            </div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">CANCEL</button>
                <button class="save-btn" onclick="saveBooking()">SAVE CHANGES</button>
            </div>
        </div>
    </div>

    <script>
        // Store all bookings globally so the modal can access them instantly
        let allBookings = [];

        async function fetchBookings() {
            try {
                const response = await fetch('https://threekg-babershop.onrender.com/api/bookings');
                allBookings = await response.json(); 
                
                const tbody = document.getElementById('bookingsBody');
                tbody.innerHTML = ''; 

                if (allBookings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No bookings found.</td></tr>';
                    return;
                }

                allBookings.forEach(booking => {
                    const tr = document.createElement('tr');
                    const location = booking.visitType === 'Home Visit' ? booking.address : booking.branch;
                    const bookingId = booking._id || booking.id;

                    tr.innerHTML = `
                        <td>
                            <div class="date-time-cell">
                                <span class="b-date">${booking.date || 'N/A'}</span>
                                <span class="b-time">${booking.time || 'N/A'}</span>
                            </div>
                        </td>
                        <td>${booking.name || 'N/A'}</td>
                        <td>${booking.phone || 'N/A'}</td>
                        <td>
                            <span class="type-badge ${booking.visitType === 'Home Visit' ? 'home' : 'walk'}">
                                ${booking.visitType || 'N/A'}
                            </span>
                        </td>
                        <td>${location || 'N/A'}</td>
                        <td>${booking.details || '-'}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="edit-btn" onclick="openModal('${bookingId}')">EDIT</button>
                                <button class="delete-btn" onclick="deleteBooking('${bookingId}')">DELETE</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching bookings:', error);
                document.getElementById('bookingsBody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--red);">Failed to load bookings. Make sure the server is running.</td></tr>';
            }
        }

        // ================= EDIT LOGIC =================

        function openModal(id) {
            const booking = allBookings.find(b => (b._id || b.id) === id);
            if (!booking) return;

            const locationStr = booking.visitType === 'Home Visit' ? booking.address : booking.branch;

            document.getElementById('editId').value = id;
            document.getElementById('editName').value = booking.name || '';
            document.getElementById('editPhone').value = booking.phone || '';
            document.getElementById('editDate').value = booking.date || '';
            document.getElementById('editTime').value = booking.time || '';
            document.getElementById('editType').value = booking.visitType || 'Walk-in';
            document.getElementById('editLocation').value = locationStr || '';

            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveBooking() {
            const id = document.getElementById('editId').value;
            const visitType = document.getElementById('editType').value;
            const locationInput = document.getElementById('editLocation').value;

            const updatedData = {
                name: document.getElementById('editName').value,
                phone: document.getElementById('editPhone').value,
                date: document.getElementById('editDate').value,
                time: document.getElementById('editTime').value,
                visitType: visitType,
                branch: visitType === 'Walk-in' ? locationInput : '',
                address: visitType === 'Home Visit' ? locationInput : ''
            };

            try {
                const response = await fetch(`https://threekg-babershop.onrender.com/api/bookings/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                if (response.ok) {
                    closeModal();
                    fetchBookings(); 
                } else {
                    alert('Failed to update booking.');
                }
            } catch (error) {
                console.error('Error updating:', error);
                alert('An error occurred.');
            }
        }

        // ================= DELETE LOGIC =================
        
        async function deleteBooking(id) {
            try {
                const response = await fetch(`https://threekg-babershop.onrender.com/api/bookings/${id}`, {
                    method: 'DELETE',
                });
                if (response.ok) {
                    fetchBookings();
                } else {
                    alert('Failed to delete the booking.');
                }
            } catch (error) {
                console.error('Error deleting booking:', error);
                alert('An error occurred while trying to delete.');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchBookings);
    </script>
</body>
</html>
